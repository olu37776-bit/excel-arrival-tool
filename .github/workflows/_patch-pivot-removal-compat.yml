name: Patch Pivot Removal Compatibility

on:
  push:
    branches: [fix/issues-52-53-vba-pivot-removal]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[pivot-removal-compat-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issues-52-53-vba-pivot-removal
          fetch-depth: 0
      - name: Patch stale system-pivot references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          gui_app = Path('src/revenue_tool/gui_app.py')
          text = gui_app.read_text(encoding='utf-8')
          old = "self.events.put(('success', result, len(result.report_months)))"
          new = "self.events.put(('success', result, 0))"
          if old not in text:
              raise SystemExit('gui success event contract not found')
          text = text.replace(old, new, 1)
          old = "self.status.set(f'生成完成 · 基表 {result.base_count} 行 · 2 张汇总表 · {count} 个实际月份 · 异常记录 {result.issue_count} 条')"
          new = "self.status.set(f'生成完成 · 基表 {result.base_count} 行 · 异常记录 {result.issue_count} 条')"
          if old not in text:
              raise SystemExit('gui success status contract not found')
          gui_app.write_text(text.replace(old, new, 1), encoding='utf-8')

          grouped = Path('tests/test_grouped_pivot_input.py')
          text = grouped.read_text(encoding='utf-8')
          marker = 'from revenue_tool.adapters.excel_reader import ExcelInputAdapter, _open_workbook\n'
          addition = marker + 'from revenue_tool.adapters.pivot_smoke_fixture import add_pivot_fixture\n'
          if marker not in text:
              raise SystemExit('grouped import marker not found')
          text = text.replace(marker, addition, 1)
          old = """            _set_manual_inputs(previous, 'C001', 'SC-A', segment_flag=False, rpd='2026-9', cpd='2026-10', amount=0)\n            add_discrete_group(previous)\n"""
          new = """            _set_manual_inputs(previous, 'C001', 'SC-A', segment_flag=False, rpd='2026-9', cpd='2026-10', amount=0)\n            workbook = load_workbook(previous)\n            try:\n                add_pivot_fixture(workbook, workbook['基表'])\n                workbook.save(previous)\n            finally:\n                workbook.close()\n            add_discrete_group(previous)\n"""
          if old not in text:
              raise SystemExit('grouped previous fixture marker not found')
          text = text.replace(old, new, 1)
          start = text.index('    def test_source_with_grouped_pivot_still_reads_business_cells(self):')
          end = text.index('    def test_read_only_preserves_cell_types_formats_and_corrects_missing_dimensions(self):')
          replacement = '''    def test_source_with_grouped_pivot_still_reads_business_cells(self):\n        with TemporaryDirectory() as tmp:\n            root = Path(tmp)\n            sources = _write_sources(root, 'sources', variant='first')\n            source_path = sources[3]\n            source = load_workbook(source_path)\n            try:\n                add_pivot_fixture(\n                    source,\n                    source.active,\n                    location_ref='AS6:AT20',\n                    name='SourceUserPivot',\n                )\n                source.save(source_path)\n            finally:\n                source.close()\n            add_discrete_group(source_path)\n            with self.assertRaisesRegex(TypeError, "Nested.from_tree.*node"):\n                load_workbook(source_path, data_only=True)\n            before = source_path.read_bytes()\n            result = _run(sources, root / 'result.xlsx')\n            self.assertEqual(7, result.base_count)\n            self.assertEqual(before, source_path.read_bytes())\n\n'''
          text = text[:start] + replacement + text[end:]
          grouped.write_text(text, encoding='utf-8')

          user = Path('tests/test_user_pivot_regions.py')
          text = user.read_text(encoding='utf-8')
          marker = 'from revenue_tool.adapters.pivot_input_view import business_sheet\n'
          addition = marker + 'from revenue_tool.adapters.pivot_smoke_fixture import add_pivot_fixture\n'
          if marker not in text:
              raise SystemExit('user pivot import marker not found')
          text = text.replace(marker, addition, 1)
          start = text.index('def add_user_pivots(path, metadata=True):')
          end = text.index('\n\nclass UserPivotRegionsTest')
          replacement = '''def add_user_pivots(path, metadata=True):\n    wb = load_workbook(path)\n    try:\n        base = wb['基表']\n        headers = [c.value for c in base[1]]\n        fake = [c.value for c in base[2]]\n        fake[headers.index('合同号')] = 'PIVOT-ONLY'\n        template = add_pivot_fixture(\n            wb, base, location_ref='AS1:CF3', name='UserRight'\n        )\n        for offset, value in enumerate(headers):\n            base.cell(1, 45 + offset, value)\n            base.cell(2, 45 + offset, fake[offset])\n        lower = deepcopy(template)\n        lower.name = 'UserBelow'\n        lower.location.ref = 'A12:AN14'\n        lower.location.firstHeaderRow = 0\n        lower.location.firstDataRow = 1\n        lower.location.rowPageCount = 0\n        lower.location.colPageCount = 0\n        lower.pageFields = []\n        base.add_pivot(lower)\n        for offset, value in enumerate(headers):\n            base.cell(12, 1 + offset, value)\n            base.cell(13, 1 + offset, fake[offset])\n        # Real business row after the lower pivot, including a manual 0.\n        real = [c.value for c in base[2]]\n        real[headers.index('合同号')] = 'REAL-AFTER-PIVOT'\n        real[headers.index('调整金额')] = 0\n        for column, value in enumerate(real, 1):\n            base.cell(18, column, value)\n        if metadata:\n            meta = wb['_tool_meta']\n            meta.append(['REAL-AFTER-PIVOT', real[headers.index('履行供应中心')], 'DEMAND_CENTER'])\n        else:\n            del wb['_tool_meta']\n        wb.save(path)\n    finally:\n        wb.close()\n'''
          text = text[:start] + replacement + text[end:]
          old = "self.assertEqual({'RegionalRevenueRPD', 'RegionalRevenueCPD'}, {p.name for s in wb for p in s._pivots})"
          new = "self.assertFalse(any(s._pivots for s in wb))"
          if old not in text:
              raise SystemExit('new output pivot assertion not found')
          text = text.replace(old, new, 1)
          old = "sheet = wb['基表']; pivot = deepcopy(wb['RPD地区收入汇总']._pivots[0])\n            pivot.name = 'UserWithFilter';pivot.location.ref = 'AS3:AX8'\n            sheet.add_pivot(pivot)"
          new = "sheet = wb['基表']\n            add_pivot_fixture(wb, sheet, location_ref='AS3:AX8', name='UserWithFilter')"
          if old not in text:
              raise SystemExit('filter pivot fixture marker not found')
          text = text.replace(old, new, 1)
          user.write_text(text, encoding='utf-8')

          Path('.github/workflows/_patch-pivot-removal-compat.yml').unlink()
          PY
      - name: Commit compatibility cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/revenue_tool/gui_app.py tests/test_grouped_pivot_input.py tests/test_user_pivot_regions.py
          git add -u .github/workflows/_patch-pivot-removal-compat.yml
          git commit -m "test: preserve user-pivot compatibility without system pivots [pivot-removal-compat-done]"
          git push origin HEAD:fix/issues-52-53-vba-pivot-removal
