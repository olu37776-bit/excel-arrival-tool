name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "pyproject.toml"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller .

      - name: Build graphical executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name ExcelRevenueTool
          --paths src
          --collect-all openpyxl
          --add-data "config/default.json;config"
          src/revenue_tool/gui.py

      - name: Test built executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\ExcelRevenueTool.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Windows executable smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\ExcelRevenueTool.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ExcelRevenueTool.exe" | Set-Content dist\SHA256SUMS.txt -Encoding ascii

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ExcelRevenueTool-Windows
          path: |
            dist/ExcelRevenueTool.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish direct download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import importlib.metadata; print(importlib.metadata.version('excel-arrival-tool'))"
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist\ExcelRevenueTool.exe dist\SHA256SUMS.txt --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag dist\ExcelRevenueTool.exe dist\SHA256SUMS.txt --target $env:GITHUB_SHA --title "Excel 收入统计工具 $tag" --notes "Windows 64 位图形版。无需安装 Python，无需运行 BAT。"
          }
