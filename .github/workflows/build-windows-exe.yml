name: Build Windows EXE

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "pyproject.toml"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: write

jobs:
  formula-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install independent formula engine and project
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-calc
          python -m pip install .
      - name: Full suite including real XLSX formula recalculation
        env:
          REQUIRE_FORMULA_ENGINE: "1"
        run: |
          python -m unittest discover -s tests
          python -m compileall -q src tests
          git diff --check
          python -m pip wheel . --no-deps --wheel-dir "${RUNNER_TEMP}/wheel"

  build:
    needs: formula-verification
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller .

      - name: Run full test suite
        run: |
          python -m unittest discover -s tests
          python -m compileall -q src tests

      - name: Resolve versioned executable name
        shell: pwsh
        run: |
          $version = python -c "import importlib.metadata; print(importlib.metadata.version('excel-arrival-tool'))"
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "EXE_NAME=ExcelRevenueTool-v$version.exe" >> $env:GITHUB_ENV

      - name: Build graphical executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "ExcelRevenueTool-v$env:APP_VERSION" `
            --paths src `
            --collect-all openpyxl `
            --add-data "config/default.json;config" `
            src/revenue_tool/gui.py

      - name: Test built executable
        shell: pwsh
        run: |
          $exePath = Join-Path "dist" $env:EXE_NAME
          $process = Start-Process -FilePath $exePath -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Windows executable smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Create checksum
        shell: pwsh
        run: |
          $exePath = Join-Path "dist" $env:EXE_NAME
          $hash = (Get-FileHash $exePath -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:EXE_NAME" | Set-Content dist\SHA256SUMS.txt -Encoding ascii

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ExcelRevenueTool-Windows-v${{ env.APP_VERSION }}-${{ github.sha }}
          path: |
            dist/${{ env.EXE_NAME }}
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish direct download
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $exePath = Join-Path "dist" $env:EXE_NAME
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exePath dist\SHA256SUMS.txt --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $exePath dist\SHA256SUMS.txt --target $env:GITHUB_SHA --title "Excel 收入统计工具 $tag" --notes "Windows 64 位图形版。无需安装 Python，无需运行 BAT。"
          }
