name: Test and Build Revenue Allocation E2E EXE

on:
  push:
    branches:
      - refactor/revenue-allocation-v1
    paths:
      - "src/**"
      - "config/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/build-phase1-windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out revenue allocation branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller .

      - name: Run full test suite
        run: python -m unittest discover -s tests

      - name: Compile sources and tests
        run: python -m compileall -q src tests

      - name: Build wheel without dependencies
        run: python -m pip wheel . --no-deps --wheel-dir wheelhouse

      - name: Build graphical executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name ExcelRevenueTool
          --paths src
          --collect-all openpyxl
          --add-data "config/default.json;config"
          src/revenue_tool/gui.py

      - name: Test built executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\ExcelRevenueTool.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Windows executable smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Name E2E branch package and create checksum
        shell: pwsh
        run: |
          Copy-Item "dist\ExcelRevenueTool.exe" "dist\ExcelRevenueTool-RevenueE2E.exe"
          $hash = (Get-FileHash "dist\ExcelRevenueTool-RevenueE2E.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  ExcelRevenueTool-RevenueE2E.exe" | Set-Content "dist\SHA256SUMS-RevenueE2E.txt" -Encoding ascii

      - name: Upload E2E branch workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExcelRevenueTool-RevenueE2E-${{ github.sha }}
          path: |
            dist/ExcelRevenueTool-RevenueE2E.exe
            dist/SHA256SUMS-RevenueE2E.txt
          if-no-files-found: error

      - name: Publish branch-only E2E prerelease download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $tag = "revenue-e2e-$shortSha"
          $title = "Excel 收入分配 E2E 分支测试包 ($shortSha)"
          $notes = "从 refactor/revenue-allocation-v1 分支构建。全量测试和 Windows EXE smoke 均在该工作流执行。源提交：$env:GITHUB_SHA。该预发布包不是 main 正式版本。"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist\ExcelRevenueTool-RevenueE2E.exe dist\SHA256SUMS-RevenueE2E.txt --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag dist\ExcelRevenueTool-RevenueE2E.exe dist\SHA256SUMS-RevenueE2E.txt --target $env:GITHUB_SHA --title $title --notes $notes --prerelease --repo $env:GITHUB_REPOSITORY
          }
